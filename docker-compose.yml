version: '3.8'

services:
  api:
    build: .
    container_name: algorise-payroll-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://algorise:algorise_secure_pass@db:5432/algorise_payroll
      - SYNC_DATABASE_URL=postgresql://algorise:algorise_secure_pass@db:5432/algorise_payroll
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: algorise-payroll-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: algorise
      POSTGRES_PASSWORD: algorise_secure_pass
      POSTGRES_DB: algorise_payroll
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algorise -d algorise_payroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algorise-payroll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
